<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">UK Fusion Evidence Observatory</title>
  <defs>
    <linearGradient id="bg" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10282d"/>
      <stop offset="1" stop-color="#061113"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop stop-color="#ffffff"/>
      <stop offset=".28" stop-color="#d9fff7"/>
      <stop offset=".62" stop-color="#7ef5da"/>
      <stop offset="1" stop-color="#7ef5da" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="174" fill="none" stroke="#7ef5da" stroke-opacity=".24" stroke-width="4"/>
  <ellipse cx="256" cy="256" rx="176" ry="76" fill="none" stroke="#7ef5da" stroke-width="22" transform="rotate(28 256 256)"/>
  <ellipse cx="256" cy="256" rx="176" ry="76" fill="none" stroke="#a991ff" stroke-width="22" transform="rotate(-28 256 256)"/>
  <circle cx="256" cy="256" r="88" fill="#7ef5da" opacity=".28" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="52" fill="url(#core)"/>
  <circle cx="256" cy="256" r="13" fill="#ffffff"/>
</svg>
