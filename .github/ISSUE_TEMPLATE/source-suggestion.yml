name: Source suggestion
description: Suggest an authoritative fusion evidence source for review
title: "Source suggestion: "
labels: ["source-suggestion"]
body:
  - type: input
    id: title
    attributes:
      label: Source title
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Source URL
      placeholder: https://...
    validations:
      required: true
  - type: dropdown
    id: class
    attributes:
      label: Source class
      options:
        - Official or legislative
        - Peer-reviewed research
        - Research repository or dataset
        - Contract, filing or patent
        - Organisation publication
        - Secondary reporting
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: Relevance to the observatory
    validations:
      required: true
